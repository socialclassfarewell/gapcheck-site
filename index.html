<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gap Check — coming soon</title>
<meta name="description" content="Gap Check is being rebuilt. Contact hello@gapcheck.net.">
<meta name="theme-color" content="#0b2e33">
<style>
  :root { --ink:#f4f1ea; --soft:#b9c9c6; --line:rgba(127,209,199,.22); --accent:#7fd1c7; --warm:#f2c572; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: Georgia, 'Times New Roman', serif; color:var(--ink); line-height:1.6;
         background:#0b2e33 radial-gradient(120% 90% at 15% 0%, #13565d 0%, #0b2e33 55%, #071d21 100%) fixed;
         min-height:100vh; display:flex; flex-direction:column; }
  main { flex:1; width:100%; max-width:1080px; margin:0 auto; padding:4rem 1.5rem;
         display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:3.5rem; align-items:center; }
  .art svg { width:100%; height:auto; display:block; }
  .eyebrow { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-transform:uppercase;
             letter-spacing:.14em; font-size:.85rem; color:var(--accent); margin-bottom:1rem; }
  h1 { font-size:clamp(2.6rem, 6vw, 4.2rem); line-height:1.05; letter-spacing:-.02em; margin-bottom:1.2rem; }
  .lede { font-size:1.2rem; color:var(--soft); max-width:30ch; margin-bottom:2rem; }
  .contact { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size:1rem; color:var(--soft); }
  a { color:var(--warm); text-underline-offset:3px; }
  a:focus-visible { outline:2px solid var(--warm); outline-offset:3px; border-radius:2px; }
  footer { max-width:1080px; width:100%; margin:0 auto; padding:1.2rem 1.5rem 2rem; border-top:1px solid var(--line);
           font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size:.9rem; color:var(--soft); }
  footer a { color:var(--soft); }
  .piece { animation: settle 7s cubic-bezier(.2,.7,.2,1) infinite; transform-box: fill-box; }
  .slot { animation: slot 7s ease-in-out infinite; }
  @keyframes settle {
    0%   { transform: translate(34px, -46px) rotate(8deg); opacity:0; }
    12%  { opacity:1; }
    38%  { transform: translate(0, 0) rotate(0); opacity:1; }
    82%  { transform: translate(0, 0) rotate(0); opacity:1; }
    100% { transform: translate(0, 0) rotate(0); opacity:0; }
  }
  @keyframes slot { 0%, 30% { opacity:.9; } 40%, 85% { opacity:0; } 100% { opacity:.9; } }
  @media (prefers-reduced-motion: reduce) { .piece, .slot { animation:none; } .slot { opacity:0; } }
  @media (max-width: 760px) {
    main { grid-template-columns:1fr; gap:2rem; padding:2.5rem 1.25rem 3rem; }
    .art { max-width:340px; }
  }
</style>
</head>
<body>
<main>
  <div class="art">
    <svg viewBox="0 0 400 400" role="img" aria-label="A grid of document tiles with the last missing piece dropping into place">
      <defs>
        <g id="doc">
          <rect width="64" height="64" rx="9" fill="rgba(127,209,199,.10)" stroke="rgba(127,209,199,.38)"/>
          <rect x="12" y="16" width="40" height="5" rx="2.5" fill="rgba(244,241,234,.38)"/>
          <rect x="12" y="29" width="30" height="5" rx="2.5" fill="rgba(244,241,234,.26)"/>
          <rect x="12" y="42" width="35" height="5" rx="2.5" fill="rgba(244,241,234,.26)"/>
        </g>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="7" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <use href="#doc" x="12" y="12" opacity="0.55"/>
      <use href="#doc" x="88" y="12" opacity="0.8"/>
      <use href="#doc" x="164" y="12" opacity="1"/>
      <use href="#doc" x="240" y="12" opacity="0.7"/>
      <use href="#doc" x="316" y="12" opacity="0.9"/>
      <use href="#doc" x="12" y="88" opacity="1"/>
      <use href="#doc" x="88" y="88" opacity="0.7"/>
      <use href="#doc" x="164" y="88" opacity="0.9"/>
      <use href="#doc" x="240" y="88" opacity="0.55"/>
      <use href="#doc" x="316" y="88" opacity="0.8"/>
      <use href="#doc" x="12" y="164" opacity="0.9"/>
      <use href="#doc" x="88" y="164" opacity="0.55"/>
      <use href="#doc" x="164" y="164" opacity="0.8"/>
      <use href="#doc" x="316" y="164" opacity="0.7"/>
      <use href="#doc" x="12" y="240" opacity="0.8"/>
      <use href="#doc" x="88" y="240" opacity="1"/>
      <use href="#doc" x="164" y="240" opacity="0.7"/>
      <use href="#doc" x="240" y="240" opacity="0.9"/>
      <use href="#doc" x="316" y="240" opacity="0.55"/>
      <use href="#doc" x="12" y="316" opacity="0.7"/>
      <use href="#doc" x="88" y="316" opacity="0.9"/>
      <use href="#doc" x="164" y="316" opacity="0.55"/>
      <use href="#doc" x="240" y="316" opacity="0.8"/>
      <use href="#doc" x="316" y="316" opacity="1"/>
      <rect class="slot" x="241" y="165" width="62" height="62" rx="9" fill="none" stroke="#f2c572" stroke-width="1.6" stroke-dasharray="6 5"/>
      <g class="piece" filter="url(#glow)">
        <rect x="240" y="164" width="64" height="64" rx="9" fill="#f2c572"/>
        <rect x="252" y="180" width="40" height="5" rx="2.5" fill="rgba(11,46,51,.55)"/>
        <rect x="252" y="193" width="30" height="5" rx="2.5" fill="rgba(11,46,51,.4)"/>
        <path d="M275 210 l6 6 l12 -13" fill="none" stroke="#0b2e33" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </svg>
  </div>
  <div>
    <p class="eyebrow">Gap Check</p>
    <h1>Coming soon.</h1>
    <p class="lede">We're rebuilding Gap Check. The new site will be here shortly.</p>
    <p class="contact">In the meantime, email <a href="mailto:hello@gapcheck.net">hello@gapcheck.net</a>.</p>
  </div>
</main>
<footer><a href="/privacy.html">Privacy policy</a> · <a href="/terms.html">Terms of service</a> · <a href="/dpa.html">Data processing addendum</a></footer>
</body>
</html>
